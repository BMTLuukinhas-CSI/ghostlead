name: Verify GhostLead
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ghostlead
          POSTGRES_USER: ghostlead
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ghostlead -d ghostlead"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
        working-directory: backend
      - name: Verify migrations against PostgreSQL
        working-directory: backend
        run: ./mvnw -B test -Dtest=MigrationTests -Dspring.datasource.url=jdbc:postgresql://localhost:5432/ghostlead -Dspring.datasource.username=ghostlead -Dspring.datasource.password=test-only-password -Dspring.flyway.enabled=true -Dspring.jpa.hibernate.ddl-auto=validate
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
  legacy-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ghostlead_legacy
          POSTGRES_USER: ghostlead
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ghostlead -d ghostlead_legacy"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Create original schema and sample records
        env:
          PGPASSWORD: test-only-password
        run: psql -h localhost -U ghostlead -d ghostlead_legacy -v ON_ERROR_STOP=1 -f backend/src/test/resources/legacy-schema.sql
      - name: Verify legacy migration
        working-directory: backend
        run: ./mvnw -B test -Dtest=LegacyMigrationTests -DlegacyMigration=true -Dspring.datasource.url=jdbc:postgresql://localhost:5432/ghostlead_legacy -Dspring.datasource.username=ghostlead -Dspring.datasource.password=test-only-password -Dspring.flyway.enabled=true -Dspring.flyway.baseline-on-migrate=true -Dspring.flyway.baseline-version=0 -Dspring.jpa.hibernate.ddl-auto=validate
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start complete application
        env:
          DB_PASSWORD: ci-test-only-password
        run: docker compose up --build -d
      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8088/api/health; then exit 0; fi
            sleep 2
          done
          docker compose logs api
          exit 1
        env:
          DB_PASSWORD: ci-test-only-password
      - run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_URL: http://127.0.0.1:8088
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            frontend/test-results
            docs/screenshots
