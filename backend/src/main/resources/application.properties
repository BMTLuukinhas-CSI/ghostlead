spring.application.name=GhostLeadAPI
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ghostlead}
spring.datasource.username=${DB_USER:ghostlead}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
server.port=${PORT:8080}
server.forward-headers-strategy=native
